<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 672" width="1000" height="672" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Same model, same context, different GPU memory</title>
<desc id="d">Three rows with the same model weights and the same KV cache. Weight-offloading engines keep most weights in CPU RAM and the KV cache on the GPU. This engine keeps all weights on the GPUs and moves the KV cache to host RAM, fetching only the rows attention needs. Stock engines need GPUs big enough for both.</desc>
<defs>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0d1117"/><rect width="3.5" height="8" fill="#6f93c8"/></pattern>
<pattern id="hk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0d1117"/><rect width="3.5" height="8" fill="#f0b443"/></pattern>
</defs>
<rect width="1000" height="672" rx="14" fill="#0d1117"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#e6edf3">Same model, same context, different GPU memory</text>
<text x="32" y="72" font-size="14" fill="#9aa7b8">Every setup needs the same model weights and the same KV cache (the working memory that holds each</text>
<text x="32" y="92" font-size="14" fill="#9aa7b8">request's context). The shaded box is GPU memory; hatched parts live outside it, in CPU or host RAM.</text>
<text x="500.0" y="134" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" fill="#9aa7b8">MODEL WEIGHTS</text>
<text x="760.0" y="134" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" fill="#9aa7b8">KV CACHE (CONTEXT)</text>
<line x1="340" y1="140" x2="340" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="660" y1="140" x2="660" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="860" y1="140" x2="860" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="340" y1="143" x2="860" y2="143" stroke="#30363d" stroke-width="1.5"/>
<text x="32" y="192" font-size="16" font-weight="700" fill="#e6edf3">Model bigger than the GPUs</text>
<rect x="32" y="202" width="185" height="22" rx="11" fill="#21262d"/>
<text x="41" y="217" font-size="12" font-weight="600" fill="#c9d1d9">Weight-offloading engines</text>
<text x="34" y="244" font-size="12" fill="#9aa7b8">few or small GPUs</text>
<text x="580" y="178" font-size="11" font-weight="600" fill="#9aa7b8">GPU memory</text>
<rect x="574" y="184" width="292" height="54" rx="6" fill="#16202e" stroke="#5a6f8f" stroke-width="1.5"/>
<rect x="340" y="192" width="240" height="38" fill="url(#hw)" stroke="#6f93c8" stroke-width="1.5"/>
<rect x="580" y="192" width="80" height="38" fill="#6f93c8"/>
<rect x="660" y="192" width="200" height="38" fill="#f0b443"/>
<text x="340" y="260" font-size="13" fill="#e6edf3">Most of the weights live in CPU RAM; the KV cache stays on the GPU.</text>
<text x="340" y="278" font-size="13" fill="#9aa7b8">Weights are streamed in for every token, so each token waits on the transfer.</text>
<rect x="18" y="314" width="964" height="148" rx="10" fill="#1d1910" stroke="#f0b443" stroke-width="1.5"/>
<text x="32" y="352" font-size="16" font-weight="700" fill="#e6edf3">Model just fits</text>
<rect x="32" y="362" width="79" height="22" rx="11" fill="#21262d"/>
<text x="41" y="377" font-size="12" font-weight="600" fill="#c9d1d9">This repo</text>
<text x="34" y="404" font-size="12" fill="#9aa7b8">4 × RTX 3090 · 8 agents × 200k</text>
<text x="340" y="338" font-size="11" font-weight="600" fill="#9aa7b8">GPU memory</text>
<rect x="334" y="344" width="356" height="54" rx="6" fill="#16202e" stroke="#5a6f8f" stroke-width="1.5"/>
<rect x="340" y="352" width="320" height="38" fill="#6f93c8"/>
<rect x="660" y="352" width="24" height="38" fill="#f0b443"/>
<rect x="684" y="352" width="176" height="38" fill="url(#hk)" stroke="#f0b443" stroke-width="1.5"/>
<text x="340" y="420" font-size="13" fill="#e6edf3">The weights fill the GPUs, so the KV cache moves to host RAM.</text>
<text x="340" y="438" font-size="13" fill="#9aa7b8">Each decode step fetches only the attention rows it needs over PCIe.</text>
<text x="32" y="512" font-size="16" font-weight="700" fill="#e6edf3">Room for model and context</text>
<rect x="32" y="522" width="178" height="22" rx="11" fill="#21262d"/>
<text x="41" y="537" font-size="12" font-weight="600" fill="#c9d1d9">Stock engines, e.g. vLLM</text>
<text x="34" y="564" font-size="12" fill="#9aa7b8">more or bigger GPUs</text>
<text x="340" y="498" font-size="11" font-weight="600" fill="#9aa7b8">GPU memory</text>
<rect x="334" y="504" width="602" height="54" rx="6" fill="#16202e" stroke="#5a6f8f" stroke-width="1.5"/>
<rect x="340" y="512" width="320" height="38" fill="#6f93c8"/>
<rect x="660" y="512" width="200" height="38" fill="#f0b443"/>
<text x="895.0" y="535.0" font-size="11" text-anchor="middle" fill="#9aa7b8">free</text>
<text x="340" y="580" font-size="13" fill="#e6edf3">Weights and the whole KV cache fit on the GPUs, with room to spare.</text>
<text x="340" y="598" font-size="13" fill="#9aa7b8">The easy case, but it needs more or bigger GPUs.</text>
<rect x="32" y="637" width="14" height="14" rx="3" fill="#6f93c8"/>
<text x="52" y="648" font-size="12" fill="#9aa7b8">model weights</text>
<rect x="161.8" y="637" width="14" height="14" rx="3" fill="#f0b443"/>
<text x="181.8" y="648" font-size="12" fill="#9aa7b8">KV cache</text>
<rect x="258.6" y="637" width="14" height="14" rx="3" fill="#16202e" stroke="#5a6f8f"/>
<text x="278.6" y="648" font-size="12" fill="#9aa7b8">GPU memory</text>
<rect x="368.6" y="637" width="14" height="14" rx="3" fill="url(#hk)"/>
<text x="388.6" y="648" font-size="12" fill="#9aa7b8">hatched: in CPU / host RAM</text>
</svg>
