<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Same model, same context, different GPU memory</title>
<desc id="d">Three rows with the same model weights and the same KV cache. In the first, the GPU memory limit falls inside the weights (offloading engines). In the second, the weights just fit and most of the KV cache lives in host RAM (this engine). In the third, weights and KV cache fit with room to spare (stock engines).</desc>
<defs>
<pattern id="hw" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0d1117"/><rect width="3.5" height="8" fill="#6f93c8"/></pattern>
<pattern id="hk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#0d1117"/><rect width="3.5" height="8" fill="#f0b443"/></pattern>
</defs>
<rect width="1000" height="680" rx="14" fill="#0d1117"/>
<text x="32" y="46" font-size="22" font-weight="700" fill="#e6edf3">Same model, same context, different GPU memory</text>
<text x="32" y="72" font-size="14" fill="#9aa7b8">Every setup needs the same model weights and the same KV cache, the working memory that holds each</text>
<text x="32" y="92" font-size="14" fill="#9aa7b8">request's context. Only the GPU memory limit moves. Hatched parts live outside GPU memory.</text>
<text x="500.0" y="134" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" fill="#9aa7b8">MODEL WEIGHTS</text>
<text x="760.0" y="134" font-size="12" font-weight="600" letter-spacing="0.6" text-anchor="middle" fill="#9aa7b8">KV CACHE (CONTEXT)</text>
<line x1="340" y1="140" x2="340" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="660" y1="140" x2="660" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="860" y1="140" x2="860" y2="146" stroke="#30363d" stroke-width="1.5"/>
<line x1="340" y1="143" x2="860" y2="143" stroke="#30363d" stroke-width="1.5"/>
<text x="32" y="184" font-size="16" font-weight="700" fill="#e6edf3">Model bigger than the GPUs</text>
<rect x="32" y="194" width="225" height="22" rx="11" fill="#21262d"/>
<text x="41" y="209" font-size="12" font-weight="600" fill="#c9d1d9">Offloading engines, e.g. Strata</text>
<text x="34" y="236" font-size="12" fill="#9aa7b8">few or small GPUs</text>
<rect x="334" y="178" width="236" height="54" rx="6" fill="#151d29" stroke="#4d607c" stroke-width="1.5"/>
<rect x="340" y="186" width="230" height="38" fill="#6f93c8"/>
<rect x="570" y="186" width="90" height="38" fill="url(#hw)" stroke="#6f93c8" stroke-width="1.5"/>
<rect x="660" y="186" width="200" height="38" fill="url(#hk)" stroke="#f0b443" stroke-width="1.5"/>
<line x1="570" y1="172" x2="570" y2="234" stroke="#e6edf3" stroke-width="2" stroke-dasharray="4 3"/>
<text x="570" y="168" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">GPU limit</text>
<text x="340" y="254" font-size="13" fill="#e6edf3">Everything past the limit lives in CPU RAM or on disk.</text>
<text x="340" y="272" font-size="13" fill="#9aa7b8">Weights are streamed in for every token, so each token waits on the transfer.</text>
<rect x="18" y="302" width="964" height="140" rx="10" fill="#1d1910" stroke="#f0b443" stroke-width="1.5"/>
<text x="32" y="334" font-size="16" font-weight="700" fill="#e6edf3">Model just fits</text>
<rect x="32" y="344" width="244" height="22" rx="11" fill="#21262d"/>
<text x="41" y="359" font-size="12" font-weight="600" fill="#c9d1d9">crazydiamond-on-ampere (this repo)</text>
<text x="34" y="386" font-size="12" fill="#9aa7b8">4 × RTX 3090 · 8 agents × 200k</text>
<rect x="334" y="328" width="348" height="54" rx="6" fill="#151d29" stroke="#4d607c" stroke-width="1.5"/>
<rect x="340" y="336" width="320" height="38" fill="#6f93c8"/>
<rect x="660" y="336" width="22" height="38" fill="#f0b443"/>
<rect x="682" y="336" width="178" height="38" fill="url(#hk)" stroke="#f0b443" stroke-width="1.5"/>
<line x1="682" y1="322" x2="682" y2="384" stroke="#e6edf3" stroke-width="2" stroke-dasharray="4 3"/>
<text x="682" y="318" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">GPU limit</text>
<text x="340" y="404" font-size="13" fill="#e6edf3">The weights fill the GPUs; only a sliver is left for the KV cache.</text>
<text x="340" y="422" font-size="13" fill="#9aa7b8">Layer weights stay on the GPUs; attention history lives in host RAM, fetched row by row.</text>
<text x="32" y="484" font-size="16" font-weight="700" fill="#e6edf3">Room for model and context</text>
<rect x="32" y="494" width="178" height="22" rx="11" fill="#21262d"/>
<text x="41" y="509" font-size="12" font-weight="600" fill="#c9d1d9">Stock engines, e.g. vLLM</text>
<text x="34" y="536" font-size="12" fill="#9aa7b8">more or bigger GPUs</text>
<rect x="334" y="478" width="596" height="54" rx="6" fill="#151d29" stroke="#4d607c" stroke-width="1.5"/>
<rect x="340" y="486" width="320" height="38" fill="#6f93c8"/>
<rect x="660" y="486" width="200" height="38" fill="#f0b443"/>
<line x1="930" y1="472" x2="930" y2="534" stroke="#e6edf3" stroke-width="2" stroke-dasharray="4 3"/>
<text x="930" y="468" font-size="11" font-weight="600" text-anchor="middle" fill="#e6edf3">GPU limit</text>
<text x="895.0" y="509.0" font-size="11" text-anchor="middle" fill="#9aa7b8">free</text>
<text x="340" y="554" font-size="13" fill="#e6edf3">Weights and the whole KV cache fit on the GPUs, with room to spare.</text>
<text x="340" y="572" font-size="13" fill="#9aa7b8">The easy case, but it needs more or bigger GPUs.</text>
<rect x="32" y="645" width="14" height="14" rx="3" fill="#6f93c8"/>
<text x="52" y="656" font-size="12" fill="#9aa7b8">model weights</text>
<rect x="161.8" y="645" width="14" height="14" rx="3" fill="#f0b443"/>
<text x="181.8" y="656" font-size="12" fill="#9aa7b8">KV cache</text>
<rect x="258.6" y="645" width="14" height="14" rx="3" fill="#151d29" stroke="#4d607c"/>
<text x="278.6" y="656" font-size="12" fill="#9aa7b8">GPU memory</text>
<rect x="368.6" y="645" width="14" height="14" rx="3" fill="url(#hw)"/>
<text x="388.6" y="656" font-size="12" fill="#9aa7b8">hatched: outside GPU memory (CPU RAM, host RAM or disk)</text>
</svg>
